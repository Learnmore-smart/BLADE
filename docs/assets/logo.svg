<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="shield-clip">
      <path d="M64 8 L112 28 V64 C112 94 92 114 64 122 C36 114 16 94 16 64 V28 Z"/>
    </clipPath>
    <linearGradient id="slash-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="edge-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- shield body -->
  <path d="M64 8 L112 28 V64 C112 94 92 114 64 122 C36 114 16 94 16 64 V28 Z"
        fill="#0b1220" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round"/>
  <!-- the cut: a diagonal band slicing the shield -->
  <g clip-path="url(#shield-clip)">
    <rect x="-14" y="46" width="156" height="13" fill="url(#slash-grad)" transform="rotate(-32 64 64)"/>
    <rect x="-14" y="63" width="156" height="4.5" fill="url(#edge-grad)" transform="rotate(-32 64 64)"/>
  </g>
  <!-- blade tip -->
  <path d="M22 96 L36 82 L30 104 Z" fill="#e2e8f0"/>
</svg>
